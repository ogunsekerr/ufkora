const cargo=[{words:'Yirmi dört milyon altı bin üç yüz beş',groups:['24','006','305']},{words:'Üç milyon seksen beş',groups:['3','000','085']},{words:'Yüz iki milyon kırk bin yedi',groups:['102','040','007']},{words:'Sekiz milyon sekiz bin sekiz',groups:['8','008','008']},{words:'Yetmiş milyon dokuz yüz bin iki',groups:['70','900','002']}];
let round=0,angle=20,radius=3,turn=0,drawn=new Set(),slots=[null,null,null],pool=[],selected=null,drag=null,complete=false,score=0,showProtractor=true,beam=false,beamStart=0,flash=0,won=false;
const light=[40,115,70,55,125],radii=[3,4,5,2,4];const labels=['Milyonlar','Binler','Birler'];
function message(s,kind=''){ $('status').textContent=s;$('status').className='status '+kind}
function levelData(){return mode==='isik'?light[round]:mode==='cember'?radii[round]:cargo[round]}
function reset(){angle=20;radius=2;turn=0;drawn.clear();slots=[null,null,null];selected=null;drag=null;complete=false;beam=false;won=false;pool=mode==='kargo'?[...cargo[round].groups].reverse().map((v,i)=>({v,id:i})):[];$('result').classList.add('hide');$('round').textContent=`5. SINIF · GÖREV ${round+1} / 5 · ★ ${score}`;$('check').disabled=false;$('next').disabled=true;$('retry').disabled=false;$('controls').innerHTML='';$('cards').innerHTML='';message('Görevi tamamla; sonra kontrol et.');let d=defs[mode];$('title').textContent=d.title;$('grade').textContent='5. sınıf · '+d.title+' · '+d.codes;$('gain').textContent=d.gain;$('helpTitle').textContent=d.title;$('helpText').textContent=d.help+(pilot?' '+d.codes+' · '+d.gain:'');
if(mode==='isik'){let n=levelData();$('task').textContent=round<3?'Hedefin açısını açıölçerden oku. Vericiyi o yöne çevir ve ışığı gönder.':`Hedef yönü ile ${180-n}°’lik açı bütünlerdir. Hedefin yönünü hesapla ve vericiyi çevir.`;$('controls').innerHTML='<label>Verici yönü: <b id="value">20°</b><input id="slider" aria-label="Verici açısı" type="range" min="0" max="180" value="20"></label><button id="minus">−1°</button><button id="plus">+1°</button><button id="protractor">Açıölçer aç/kapat</button>';$('slider').oninput=e=>setAngle(+e.target.value);$('minus').onclick=()=>setAngle(angle-1);$('plus').onclick=()=>setAngle(angle+1);$('protractor').onclick=()=>{showProtractor=!showProtractor;$('protractor').setAttribute('aria-pressed',String(showProtractor));draw()};$('legend').textContent='Açıölçer sağdaki 0°’den başlar. Hedefin merkezini esas al.';$('check').textContent='Işığı gönder →'}
if(mode==='cember'){$('task').textContent=round<3?`Eksik tekerleğin yarıçapı ${levelData()} cm. Pergeli ayarla ve tam çember çiz.`:`Tekerleğin çapı ${levelData()*2} cm. Pergel açıklığını bul ve tam çember çiz.`;$('controls').innerHTML='<label>Pergel açıklığı: <b id="value">2 cm</b><input id="slider" aria-label="Pergel açıklığı" type="range" min="1" max="5" step="1" value="2"></label><button id="rotate">Pergeli döndür +30°</button>';$('slider').oninput=e=>{if(complete)return;radius=+e.target.value;drawn.clear();turn=0;$('value').textContent=radius+' cm';draw()};$('rotate').onclick=()=>{if(complete)return;for(let i=0;i<6;i++)drawn.add((turn+i)%72);turn=(turn+6)%72;draw();message(`Çemberin %${Math.round(drawn.size/72*100)}’i çizildi.`)};$('legend').textContent='Mor kesikli çember hedefi gösterir. Turuncu uçtan tutup döndür. 1 cm = cetvelde bir aralık.';$('check').textContent='Tekerleği kontrol et'}
if(mode==='kargo'){$('task').textContent=cargo[round].words;$('legend').textContent='Kasayı seç ve yuvaya yerleştir veya sürükle. Bölükler sağdan üçlü gruplandırılır.';$('check').textContent='Kargoyu gönder →';renderCargoControls()}draw()}
function setAngle(n){if(complete)return;angle=Math.max(0,Math.min(180,n));$('slider').value=angle;$('value').textContent=angle+'°';beam=false;draw()}
function renderCargoControls(){$('cards').innerHTML='';pool.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p.v;b.setAttribute('aria-label',p.v+' kasasını seç');b.disabled=complete||slots.includes(i);if(selected===i)b.className='selected';b.onclick=()=>{selected=i;renderCargoControls();draw()};$('cards').append(b)});$('controls').innerHTML='';labels.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.setAttribute('aria-label',s+' yuvasına yerleştir');b.disabled=complete;b.onclick=()=>place(i);$('controls').append(b)})}
function place(i){if(complete)return;if(selected===null){slots[i]=null}else{let old=slots.indexOf(selected);if(old>=0)slots[old]=null;slots[i]=selected;selected=null}renderCargoControls();draw()}
function isCorrect(){if(mode==='isik')return angle===light[round];if(mode==='cember')return radius===radii[round]&&drawn.size===72;return slots.every((s,i)=>s!==null&&pool[s].v===cargo[round].groups[i])}
function check(){if(complete)return;let ok=isCorrect();if(mode==='isik'){beam=true;beamStart=performance.now();flash=ok?1:0}if(!ok){message(mode==='isik'?`Hedefe ulaşmadı. ${angle}° yönünü yeniden kontrol et.`:mode==='cember'?(radius!==radii[round]?'Pergel açıklığı hedefe uymuyor. Yarıçap merkezden kenara, çap bir uçtan diğerine uzaklıktır.':`Yarıçap doğru. Tam çember için kalan ${72-drawn.size} küçük yay aralığını tamamla.`):'Kargo adresindeki sayı oluşmadı. Bölükleri ve sıfırların yerlerini kontrol et.','bad');draw();return}complete=true;score++;$('check').disabled=true;$('next').disabled=false;$('round').textContent=`5. SINIF · GÖREV ${round+1} / 5 · ★ ${score}`;message(mode==='isik'?`Hedef aydınlandı! ${angle}° yönü doğru.${round>=3?' '+angle+' + '+(180-angle)+' = 180°.':''}`:mode==='cember'?`Tekerlek tamamlandı! Merkezden çembere uzaklık her yönde ${radius} cm.`:`Kargo doğru adrese gidiyor: ${cargo[round].groups.join(' ')}.`,'good');if(mode==='kargo')renderCargoControls();draw()}
function next(){if(!complete)return;if(round<4){round++;reset()}else{won=true;$('next').disabled=true;$('retry').disabled=true;$('result').classList.remove('hide');$('result').innerHTML=`<h2>5 görev tamamlandı · ★ ${score} / 5</h2><p>${defs[mode].gain}</p><p>Son kontrol: öğrendiğin ilişkiyi yeni bir örnekle açıkla.</p><a href="index.html" style="color:#6545aa">Başka oyun seç →</a> <button id="restart">Yeniden oyna</button>`;$('restart').onclick=()=>{score=0;round=0;reset()}}}
function text(s,x,y,size=24,color='#fff',align='center'){ctx.font=`700 ${size}px Arial`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(s,x,y)}
function line(x,y,a,b,color,w=3){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke()}
function box(x,y,w,h,col,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,15);ctx.fillStyle=col;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
function circle(x,y,r,col,w=3){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}
function draw(){ctx.clearRect(0,0,960,620);ctx.fillStyle=mode==='isik'?'#142741':mode==='cember'?'#e9dfef':'#dfeddf';ctx.fillRect(0,0,960,620);
if(mode==='isik'){for(let i=0;i<40;i++)circle((i*173)%960,(i*79)%620,1,'#71869f',1);const x=480,y=470,r=310;let target=light[round]*Math.PI/180,tx=x+r*Math.cos(target),ty=y-r*Math.sin(target);if(showProtractor){ctx.strokeStyle='#638c9a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,Math.PI,Math.PI*2);ctx.stroke();for(let d=0;d<=180;d+=5){let a=d*Math.PI/180;line(x+(r-10)*Math.cos(a),y-(r-10)*Math.sin(a),x+r*Math.cos(a),y-r*Math.sin(a),'#87adb7',2);if(d%(pilot&&difficulty==='hard'?30:10)===0)text(d,x+(r-35)*Math.cos(a),y-(r-35)*Math.sin(a),15,'#b5d4d7')}}line(140,y,820,y,'#8daeb7',2);circle(tx,ty,24,complete?'#fff58a':'#f9ca5f',5);circle(tx,ty,10,'#ffda78',3);text('HEDEF',tx,ty-38,17,'#ffe194');let a=angle*Math.PI/180;if(beam){ctx.shadowBlur=18;ctx.shadowColor='#fce38b';line(x,y,x+410*Math.cos(a),y-410*Math.sin(a),'#ffda61',7);ctx.shadowBlur=0}line(x,y,x+75*Math.cos(a),y-75*Math.sin(a),'#a590dc',17);box(x-40,y-22,80,55,'#6d56a9');circle(x,y,12,'#d9d1f1',6);text(angle+'°',x,555,33,'#ffe194');if(!pilot)text(round<3?'Ölç → yönlendir → aydınlat':'Bütünler açıları kullan',480,75,25,'#d1e2e9')}
if(mode==='cember'){let x=480,y=300,s=44;box(95,75,770,430,'#f8f5ee','#d4c6df');ctx.setLineDash([8,8]);circle(x,y,radii[round]*s,'#a78ac7',3);ctx.setLineDash([]);ctx.strokeStyle='#e19b3c';ctx.lineWidth=7;drawn.forEach(i=>{ctx.beginPath();ctx.arc(x,y,radius*s,i*2*Math.PI/72,(i+1)*2*Math.PI/72+.005);ctx.stroke()});let a=turn*2*Math.PI/72;line(x,y,x+radius*s*Math.cos(a),y+radius*s*Math.sin(a),'#6b5694',6);circle(x,y,6,'#554776',6);circle(x+radius*s*Math.cos(a),y+radius*s*Math.sin(a),12,'#d78c29',6);text('O',x-18,y-15,20,'#554776');box(290,535,370,45,'#f9e7b9');for(let i=0;i<=7;i++){line(310+i*44,535,310+i*44,548,'#8d7144',2);text(i,310+i*44,570,17,'#6b5939')}text('cm',690,567,17,'#6b5939');if(complete)text('✓ Çember tamamlandı',480,50,24,'#486d48')}
if(mode==='kargo'){box(90,170,780,265,'#faf2d8');text('BÖLÜK YÜKLEME İSTASYONU',480,85,26,'#46665b');labels.forEach((l,i)=>{let x=140+i*235;box(x,225,210,130,'#e6e7dc','#8baba0');text(l,x+105,205,20,'#48665b');if(slots[i]!==null){box(x+10,235,190,110,complete?'#a4d697':'#ebc276');text(pool[slots[i]].v,x+105,305,43,'#4b3c26')}else text('?',x+105,305,40,'#8aa494')});pool.forEach((p,i)=>{let x=230+i*180;if(!slots.includes(i)){box(x,470,145,80,selected===i?'#c1a5e1':'#efc47f');text(p.v,x+72,523,33,'#523f29')}});if(complete){box(305,570,350,32,'#41885f');text('✓ Kargo yola çıktı',480,592,20,'#fff')}}}
function point(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*620/r.height}}
function circleTrace(p){let dx=p.x-480,dy=p.y-300;if(Math.hypot(dx,dy)<20)return;let v=(Math.atan2(dy,dx)+Math.PI*2)%(Math.PI*2),n=Math.floor(v/(Math.PI*2)*72)%72;let delta=(n-turn+72)%72;if(delta>36)delta-=72;if(Math.abs(delta)<=12){let sign=Math.sign(delta);for(let i=0;i<=Math.abs(delta);i++)drawn.add((turn+sign*i+72)%72)}turn=n;draw()}
cv.onpointerdown=e=>{if(complete)return;let p=point(e);cv.setPointerCapture(e.pointerId);if(mode==='cember'){let a=turn*2*Math.PI/72,x=480+radius*44*Math.cos(a),y=300+radius*44*Math.sin(a);if(Math.hypot(p.x-x,p.y-y)<38)drag='circle'}if(mode==='kargo'){let found=pool.findIndex((v,i)=>!slots.includes(i)&&p.x>=230+i*180&&p.x<=375+i*180&&p.y>=470&&p.y<=550);if(found>=0){selected=found;drag='cargo';renderCargoControls();draw()}else if(p.y>=225&&p.y<=355){let i=Math.floor((p.x-140)/235);if(i>=0&&i<3&&p.x<=350+i*235)place(i)}}};
cv.onpointermove=e=>{if(drag==='circle'&&!complete)circleTrace(point(e))};cv.onpointerup=e=>{let p=point(e);if(drag==='cargo'&&p.y>=225&&p.y<=355){let i=Math.floor((p.x-140)/235);if(i>=0&&i<3&&p.x<=350+i*235)place(i)}drag=null};cv.onpointercancel=()=>{drag=null};
// T34/T35: isolated pilot setup; the circle activity retains its existing flow.
const pilot=mode==='kargo'||mode==='isik';
const params=new URLSearchParams(location.search);
function option(name,allowed,fallback){const v=params.getAll(name);return v.length===1&&allowed.includes(v[0])?v[0]:fallback}
let difficulty=option('difficulty',['easy','medium','hard'],'easy'),duration=Number(option('duration',['0','60','120','180'],'0'));
let started=false,expired=false,remaining=0,clockAt=0,clockHidden=document.hidden,helpOpen=false,attempts=0;
const earned=new Set();
function clockActive(){return pilot&&started&&!complete&&!expired&&!clockHidden&&!helpOpen}
function tick(){const now=performance.now();if(clockActive()&&duration)remaining=Math.max(0,remaining-(now-clockAt));clockAt=now;if(clockActive()&&duration&&remaining<=0){expired=true;complete=true;drag=null;$('check').disabled=true;$('next').disabled=true;if(mode==='kargo')renderCargoControls();message('Süre doldu. Tekrar deneyebilir veya ayarları değiştirebilirsin.');}if(pilot)$('clock').textContent=duration?Math.ceil(remaining/1000)+' sn':'Süresiz'}
function openEntry(){tick();started=false;drag=null;document.querySelector('main').hidden=true;$('entry').classList.remove('hide');$('entry-start').focus()}
function begin(){difficulty=document.querySelector('[name=difficulty]:checked').value;duration=Number(document.querySelector('[name=duration]:checked').value);round=0;score=0;earned.clear();started=true;$('entry').classList.add('hide');document.querySelector('main').hidden=false;reset();cv.focus()}
const originalReset=reset;
reset=function(){if(pilot){attempts=0;expired=false;remaining=duration*1000;clockAt=performance.now();showProtractor=true;}originalReset();if(!pilot)return;$('grade').textContent='5. sınıf · '+defs[mode].title;$('gain').textContent='';$('legend').textContent='';message('');if(mode==='isik'){$('task').textContent=round<3?'Hedefin açısını ölç ve ışığı yönlendir.':`Hedef ile ${180-light[round]}° bütünler. Hedef açısını bul.`;showProtractor=difficulty==='easy'||round<3;$('protractor').setAttribute('aria-pressed',String(showProtractor));}else{$('task').textContent=cargo[round].words;renderCargoControls();}tick();draw();};
const originalCheck=check;
check=function(){if(pilot){tick();if(!started||expired)return;attempts++;}originalCheck();if(pilot&&complete&&!expired){earned.add(round);score=earned.size;$('round').textContent=`5. SINIF · GÖREV ${round+1} / 5 · ★ ${score}`;}if(pilot&&mode==='kargo'&&!complete)renderCargoControls();};
const originalNext=next;
next=function(){if(!pilot){originalNext();return}if(!complete||expired)return;if(round<4){round++;reset();}else{started=false;openEntry();}};
const originalCargo=renderCargoControls;
renderCargoControls=function(){originalCargo();if(!pilot||mode!=='kargo')return;if(difficulty==='easy'||(difficulty==='medium'&&attempts>0)){[...$('cards').children].forEach((button,i)=>{const group=cargo[round].groups.indexOf(pool[i].v);button.textContent=pool[i].v+' · '+labels[group];});}};
if(pilot){
 const support=mode==='kargo'?['Kasalarda bölük ipuçları görünür.','Bölük ipuçları ilk denemeden sonra görünür.','Kasalar yalnız sayıları gösterir.']:['Açıölçer tüm görevlerde açık başlar.','Bütünler görevlerinde açıölçer isteğe bağlı.','Seyrek sayı etiketleri; bütünler görevlerinde açıölçer isteğe bağlı.'];
 const radios=(name,values,texts)=>values.map((v,i)=>`<label><input type="radio" name="${name}" value="${v}" ${String(name==='difficulty'?difficulty:duration)===v?'checked':''}> ${texts[i]}${name==='difficulty'?'<small>'+support[i]+'</small>':''}</label>`).join('');
 $('entry').innerHTML=`<div class="entry-scene"><img src="../assets/activities/${mode}.webp" width="768" height="512" alt="${defs[mode].title} oyun hamuru sahnesi"></div><div><div>5. sınıf</div><h1 id="entry-title">${defs[mode].title}</h1><p>${mode==='kargo'?'Kasaları yerleştir, verilen sayıyı oluştur.':'Açıyı bul, ışığı hedefe yönlendir.'}</p><details><summary>Yardım ve kazanımlar</summary><p>${defs[mode].help}</p><p>${defs[mode].codes} · ${defs[mode].gain}</p></details><fieldset><legend>Zorluk</legend>${radios('difficulty',['easy','medium','hard'],['Kolay','Orta','Zor'])}</fieldset><fieldset class="time-options"><legend>Görev süresi</legend>${radios('duration',['0','60','120','180'],['Süresiz','60 saniye','120 saniye','180 saniye'])}<small>Her görevde yeniden başlar. Arka sekmede ve yardımda durur.</small></fieldset><button id="entry-start" class="start">Başlat</button></div>`;
 $('entry-start').onclick=begin;
 const clock=document.createElement('span');clock.id='clock';clock.className='timer';clock.setAttribute('aria-label','Kalan görev süresi');document.querySelector('header').append(clock);
 const settings=document.createElement('button');settings.textContent='Ayarlar';settings.onclick=openEntry;document.querySelector('header').append(settings);
 document.querySelector('.progress').hidden=true;
 $('helpText').textContent=defs[mode].help+' '+defs[mode].codes;
 document.addEventListener('visibilitychange',()=>{tick();clockHidden=document.hidden;clockAt=performance.now()});
 $('help').addEventListener('close',()=>{helpOpen=false;clockAt=performance.now()});
 setInterval(tick,100);
}

$('check').onclick=check;$('next').onclick=next;$('retry').onclick=()=>{if(!pilot&&complete){message('Sonraki göreve geçebilir veya oyun sonunda yeniden başlayabilirsin.');return}reset()};$('info').onclick=()=>{if(pilot){tick();helpOpen=true;}$('help').showModal()};$('close').onclick=()=>$('help').close();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else message('Bu tarayıcı tam ekranı desteklemiyor.')}catch{message('Tam ekran açılamadı. Tarayıcının tam ekran komutunu kullan.')}};reset();if(pilot)openEntry();
